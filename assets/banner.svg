<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: url(#text-grad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #c9d1d9; }
    .pulse-circle { animation: pulse 4s infinite ease-in-out; }
    .float-node { animation: float 6s infinite ease-in-out; }
    .dash-line { stroke-dasharray: 8 8; animation: dash 20s linear infinite; }
    
    @keyframes pulse {
      0% { r: 180px; opacity: 0.15; }
      50% { r: 240px; opacity: 0.3; }
      100% { r: 180px; opacity: 0.15; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- Dynamic Background Animations (Strictly Background) -->
  <circle cx="1000" cy="180" r="200" fill="#58a6ff" class="pulse-circle" opacity="0.2" filter="url(#glow)"/>
  <circle cx="150" cy="80" r="120" fill="#bc8cff" class="pulse-circle" opacity="0.15" filter="url(#glow)"/>

  <!-- Connecting Lines (Background Tech Theme) -->
  <path d="M 100 280 Q 300 320 600 280 T 1100 260" fill="none" stroke="#30363d" stroke-width="2" class="dash-line"/>
  <path d="M 50 100 Q 400 40 800 120 T 1150 60" fill="none" stroke="#238636" stroke-width="1.5" opacity="0.4" class="dash-line"/>

  <!-- Decorative Pills / Graphics in Background -->
  <g class="float-node" opacity="0.4">
    <rect x="920" y="60" width="180" height="40" rx="20" fill="url(#card-grad)" stroke="#58a6ff" stroke-width="1"/>
    <text x="1010" y="85" text-anchor="middle" class="badge-text" fill="#58a6ff">🚀 OpenAI × OpenClaw</text>

    <rect x="860" y="130" width="220" height="40" rx="20" fill="url(#card-grad)" stroke="#bc8cff" stroke-width="1"/>
    <text x="970" y="155" text-anchor="middle" class="badge-text" fill="#bc8cff">⚡ Microsoft × Python</text>

    <rect x="900" y="200" width="200" height="40" rx="20" fill="url(#card-grad)" stroke="#3fb950" stroke-width="1"/>
    <text x="1000" y="225" text-anchor="middle" class="badge-text" fill="#3fb950">📦 Apple × LLVM</text>
  </g>

  <!-- Foreground Content Container (Ensures Title & Subtitle sit clearly above graphics) -->
  <g transform="translate(80, 0)">
    <!-- Header Badge -->
    <rect x="0" y="65" width="230" height="32" rx="16" fill="#238636" fill-opacity="0.2" stroke="#238636" stroke-width="1"/>
    <text x="115" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-weight="600" font-size="13" fill="#3fb950">🌟 OPEN-SOURCE TALENT HUB</text>

    <!-- Main Title -->
    <text x="0" y="150" class="title">Top Acqui-Hires 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle">A curated directory of high-profile open-source talent acquisitions,</text>
    <text x="0" y="225" class="subtitle">creator recruitments, and corporate engineering talent grabs.</text>

    <!-- Key Metrics / Tags -->
    <g transform="translate(0, 265)">
      <rect x="0" y="0" width="130" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="65" y="19" text-anchor="middle" class="badge-text">💻 AI Researchers</text>

      <rect x="142" y="0" width="130" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="207" y="19" text-anchor="middle" class="badge-text">🛠️ Core Maintainers</text>

      <rect x="284" y="0" width="140" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="354" y="19" text-anchor="middle" class="badge-text">🌐 Cloud Architectures</text>
    </g>
  </g>
</svg>
